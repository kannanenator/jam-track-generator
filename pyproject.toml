[project]
name = "jam-track-generator"
version = "0.1.0"
description = "Generate MIDI backing tracks to jam over"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["mido>=1.3"]

[project.scripts]
jamtrack = "jamtrack.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jamtrack"]
